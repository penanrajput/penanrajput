<svg width="100%" height="100%" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="glowIndigo" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="15%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  
  <!-- Subtle Grid -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="360" rx="16" fill="url(#glowIndigo)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowCyan)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowPurple)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- LEFT SECTION: Identity & Headline -->

  <!-- Status / Role Pill -->
  <g transform="translate(60, 48)">
    <rect width="365" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981" />
    <circle cx="18" cy="16" r="8" fill="#10b981" fill-opacity="0.25" />
    <text x="34" y="21" class="mono" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">SENIOR SOFTWARE ENGINEER</text>
    <text x="245" y="21" class="mono" font-size="12" fill="#64748b">|</text>
    <text x="260" y="21" class="mono" font-size="12" fill="#94a3b8">TELECOM</text>
  </g>

  <!-- Name -->
  <text x="60" y="132" class="sans" font-size="52" font-weight="800" letter-spacing="-1.5" fill="url(#nameGradient)">PENAN RAJPUT</text>

  <!-- Core Role & Domain -->
  <text x="62" y="168" class="sans" font-size="21" font-weight="600" fill="url(#accentGradient)">
    Java Backend &amp; Distributed Systems Specialist
  </text>

  <!-- Summary Line -->
  <text x="62" y="200" class="sans" font-size="15" font-weight="400" fill="#94a3b8">
    4.8+ Years Experience in Scalable Microservices, High-Throughput Telemetry &amp; Resilient Cloud Architectures
  </text>

  <!-- Tech Stack Chips -->
  <g transform="translate(60, 240)">
    <!-- Java -->
    <g transform="translate(0, 0)">
      <rect width="78" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-opacity="0.7" />
      <text x="39" y="21" text-anchor="middle" class="badge-text" fill="#f8fafc">☕ Java</text>
    </g>
    <!-- Spring Boot -->
    <g transform="translate(88, 0)">
      <rect width="128" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-opacity="0.7" />
      <text x="64" y="21" text-anchor="middle" class="badge-text" fill="#4ade80">🌱 Spring Boot</text>
    </g>
    <!-- Microservices -->
    <g transform="translate(226, 0)">
      <rect width="138" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-opacity="0.7" />
      <text x="69" y="21" text-anchor="middle" class="badge-text" fill="#38bdf8">⚡ Microservices</text>
    </g>
    <!-- ClickHouse -->
    <g transform="translate(374, 0)">
      <rect width="118" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-opacity="0.7" />
      <text x="59" y="21" text-anchor="middle" class="badge-text" fill="#fbbf24">📊 ClickHouse</text>
    </g>
    <!-- Kafka -->
    <g transform="translate(502, 0)">
      <rect width="86" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-opacity="0.7" />
      <text x="43" y="21" text-anchor="middle" class="badge-text" fill="#e2e8f0">📨 Kafka</text>
    </g>
    <!-- Kubernetes -->
    <g transform="translate(598, 0)">
      <rect width="120" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-opacity="0.7" />
      <text x="60" y="21" text-anchor="middle" class="badge-text" fill="#60a5fa">☸️ Kubernetes</text>
    </g>
    <!-- Redis -->
    <g transform="translate(728, 0)">
      <rect width="82" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-opacity="0.7" />
      <text x="41" y="21" text-anchor="middle" class="badge-text" fill="#f87171">⚡ Redis</text>
    </g>
  </g>

  <!-- Location & Availability footer -->
  <g transform="translate(62, 310)">
    <text x="0" y="0" class="mono" font-size="13" fill="#64748b">
      📍 Pune, India &nbsp;&nbsp;•&nbsp;&nbsp; 🚀 High Performance APIs &nbsp;&nbsp;•&nbsp;&nbsp; 🛠️ DevOps &amp; CI/CD &nbsp;&nbsp;•&nbsp;&nbsp; 📈 Observability
    </text>
  </g>

  <!-- RIGHT SECTION: System Metrics Glassmorphism Card -->
  <g transform="translate(850, 48)">
    <!-- Card Frame -->
    <rect width="290" height="236" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-opacity="0.8" stroke-width="1.2" />
    
    <!-- Window Dots -->
    <circle cx="24" cy="22" r="5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="56" cy="22" r="5" fill="#10b981" fill-opacity="0.8" />
    <text x="80" y="26" class="mono" font-size="11" fill="#64748b">telemetry-stats.log</text>

    <!-- Divider -->
    <line x1="16" y1="40" x2="274" y2="40" stroke="#334155" stroke-opacity="0.6" />

    <!-- Stat 1: Experience -->
    <g transform="translate(24, 68)">
      <text x="0" y="0" class="sans" font-size="28" font-weight="800" fill="#38bdf8">4.8+ Yrs</text>
      <text x="0" y="18" class="sans" font-size="12" font-weight="500" fill="#94a3b8">Backend Engineering</text>
    </g>

    <!-- Stat 2: Performance Boost -->
    <g transform="translate(155, 68)">
      <text x="0" y="0" class="sans" font-size="28" font-weight="800" fill="#4ade80">+30%</text>
      <text x="0" y="18" class="sans" font-size="12" font-weight="500" fill="#94a3b8">API Response Speed</text>
    </g>

    <!-- Divider -->
    <line x1="24" y1="112" x2="266" y2="112" stroke="#334155" stroke-opacity="0.4" />

    <!-- Metric 3: Architecture -->
    <g transform="translate(24, 136)">
      <text x="0" y="0" class="mono" font-size="11" fill="#818cf8">&gt; Architecture: NPMS / Big Data</text>
      <text x="0" y="20" class="mono" font-size="11" fill="#cbd5e1">&gt; DB: ClickHouse Distributed</text>
      <text x="0" y="40" class="mono" font-size="11" fill="#cbd5e1">&gt; Telemetry: Sub-second Query</text>
      <text x="0" y="60" class="mono" font-size="11" fill="#10b981">&gt; Deploy: K8s / Zero-Downtime [OK]</text>
    </g>
  </g>
</svg>
